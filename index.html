<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLM Pipeline Explorer</title>
  <style>
    /* Reset and baseline styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      line-height: 1.6;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
      padding: 2rem;
      border: 1px solid #e2e8f0;
    }

    header {
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 1.5rem;
      margin-bottom: 2rem;
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      color: #0f172a;
      margin-bottom: 0.5rem;
    }

    p.subtitle {
      color: #64748b;
      font-size: 1rem;
    }

    .card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .card h2 {
      font-size: 1.25rem;
      margin-bottom: 0.75rem;
      color: #2563eb;
    }

    .card p {
      color: #475569;
      margin-bottom: 1rem;
    }

    .btn {
      display: inline-block;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      padding: 0.65rem 1.25rem;
      font-size: 0.95rem;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn:hover {
      background-color: #1d4ed8;
    }

    #statusMessage {
      margin-top: 1rem;
      font-weight: 500;
      color: #16a34a;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>LLM Pipeline Explorer</h1>
      <p class="subtitle">An interactive visual guide to understanding how Large Language Models process text.</p>
    </header>

    <main>
      <section class="card">
        <h2>Welcome to the Pipeline</h2>
        <p>This explorer will break down how an LLM transforms user prompts into responses step-by-step.</p>
        <button id="testBtn" class="btn">Test Setup</button>
        <div id="statusMessage"></div>
      </section>
    </main>
  </div>

  <script>
    // WHAT THIS DOES: Finds the HTML elements on the page so we can interact with them using code.
    const testButton = document.getElementById('testBtn');
    const statusDisplay = document.getElementById('statusMessage');

    // WHAT THIS DOES: Listens for a click on the test button and updates the page text to verify that JavaScript is running properly.
    testButton.addEventListener('click', function() {
      statusDisplay.textContent = 'Setup verified! Ready to build the next stage of the pipeline.';
    });
  </script>
</body>
</html>
